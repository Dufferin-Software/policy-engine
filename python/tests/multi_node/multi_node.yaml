name: "multi-node"
version: "1.0"
package_dir: "../../../.."

networks:
  - name: "mgmt"
    subnet: "10.10.0.0/24"
    mtu: 1500

  - name: "data"
    subnet: "10.20.0.0/24"
    mtu: 1500

nodes:
  # Controller node — runs policy-controller daemon
  - name: "controller"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 512
    vcpus: 1
    networks:
      - "mgmt"
    packages:
      - "policy-controller_*.deb"
      - "policy-controller-client_*.deb"

  # Node 1: runs policy-engine + policy-node-agent
  - name: "node1"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"
    packages:
      features:
        vanilla:
          - "policy-engine_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips:
          - "policy-engine-ips_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ipfix:
          - "policy-engine-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips-ipfix:
          - "policy-engine-ips-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"

  # Node 2: runs policy-engine + policy-node-agent
  - name: "node2"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"
    packages:
      features:
        vanilla:
          - "policy-engine_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips:
          - "policy-engine-ips_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ipfix:
          - "policy-engine-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips-ipfix:
          - "policy-engine-ips-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"

  # Node 3: runs policy-engine + policy-node-agent (used for decommission test)
  - name: "node3"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
      - "data"
    packages:
      features:
        vanilla:
          - "policy-engine_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips:
          - "policy-engine-ips_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ipfix:
          - "policy-engine-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"
        ips-ipfix:
          - "policy-engine-ips-ipfix_*.deb"
          - "policy-engine-client_*.deb"
          - "policy-node-agent_*.deb"

