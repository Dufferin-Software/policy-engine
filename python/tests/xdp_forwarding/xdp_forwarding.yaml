name: "xdp-forwarding-topology"
version: "1.0"
package_dir: "../../../.."

networks:
  - name: "net1"
    subnet: "10.1.1.0/24"
    ipv6_subnet: "2001:db8:1::/64"
    mtu: 1500

  - name: "net2"
    subnet: "10.1.2.0/24"
    ipv6_subnet: "2001:db8:2::/64"
    mtu: 1500

nodes:
  # Client: connects to net1 only
  - name: "client"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 512
    vcpus: 1
    networks:
      - "net1"

  # Transit: connects to net1 and net2 — policy-engine runs here
  - name: "transit"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 1024
    vcpus: 2
    networks:
      - "net1"
      - "net2"
    packages:
      features:
        vanilla:
          - "policy-engine_*.deb"
          - "policy-engine-client_*.deb"
        ips:
          - "policy-engine-ips_*.deb"
          - "policy-engine-client_*.deb"
        ipfix:
          - "policy-engine-ipfix_*.deb"
          - "policy-engine-client_*.deb"
        ips-ipfix:
          - "policy-engine-ips-ipfix_*.deb"
          - "policy-engine-client_*.deb"

  # Server: connects to net2 only
  - name: "server"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 512
    vcpus: 1
    networks:
      - "net2"
