name: "scale-test"
version: "1.0"
package_dir: "../../../.."

networks:
  - name: "mgmt"
    subnet: "10.10.0.0/24"
    mtu: 1500

nodes:
  # Controller node — runs policy-controller as a systemd service
  - name: "controller"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 1024
    vcpus: 2
    networks:
      - "mgmt"
    packages:
      - "policy-controller_*.deb"
      - "policy-controller-client_*.deb"

  # Docker host — runs N policy-engine + policy-node-agent container pairs
  # Increase memory for larger --scale-nodes values:
  #   10 nodes  → 4096 MB
  #   25 nodes  → 8192 MB
  #   50 nodes  → 16384 MB
  - name: "docker-host"
    image:
      name: "debian-13-genericcloud"
      url: "https://cloud.debian.org/images/cloud/trixie/20260413-2447/debian-13-genericcloud-amd64-20260413-2447.qcow2"
      checksum: "3d020c868339c8387f6f40f63e6b5ccb6174e6f2963510cb51cacfd6618244e96549d1b60b3d629df3963cb5350c6dfaf5cf34998301aa578b9d455a76d3c434"
    memory: 8192
    vcpus: 4
    networks:
      - "mgmt"
