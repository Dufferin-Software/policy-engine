# Python side of policy-engine: the integration test suites and the Python
# clients they drive. The Rust crates are built by cargo; see Cargo.toml.
#
# The suites run against VMs managed by netsim, which supplies the pytest
# fixtures (topology, nodes, SSH, package install) via netsim.testkit.
# See python/README.md.

[tool.poetry]
name = "policy-engine-integration"
version = "0.1.0"
description = "Integration tests and Python clients for policy-engine"
authors = ["Peter <peter@gmail.com>"]
readme = "python/README.md"
packages = [{include = "policy_engine_client", from = "python"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
netsim = {git = "ssh://git@github.com/pdmorrow/netsim.git", tag = "v0.2.0", extras = ["testkit"]}

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
mypy = "^1.19.1"
types-paramiko = "*"
types-netaddr = "*"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
log_cli = false
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s.%(msecs)03d %(levelname)-5s %(name)s:%(filename)s:%(lineno)d %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "-v",
    "--tb=short",
    "--log-level=INFO",
]
# Distinct from netsim's own cache_dir so concurrent runs don't fight.
cache_dir = "/tmp/pytest_cache_policy_engine"
markers = [
    "slow: marks tests as slow (scheduler waits, 45+ s); exclude with -m 'not slow'",
]

[tool.mypy]
files = ["python"]
# libvirt-python ships no type stubs and has no py.typed marker
[[tool.mypy.overrides]]
module = "libvirt"
ignore_missing_imports = true

# scapy and aioquic are only installed on the simulated nodes that run the
# SNI sender scripts (python/tests/sni_matching/*_sni_send.py), not in the dev
# venv, and ship no type stubs.
[[tool.mypy.overrides]]
module = ["scapy.*", "aioquic.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
