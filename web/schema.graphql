"""
Input for enabling or disabling XDP FIB forwarding on a single interface.
"""
input SetFibForwardingInput {
	interface: String!
	enabled: Boolean!
}

"""
Input for setting the uRPF mode on a single ingress interface.
"""
input SetUrpfInput {
	interface: String!
	mode: UrpfMode!
