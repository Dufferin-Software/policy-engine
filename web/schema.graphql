"""
Action with priority input
"""
input ActionInput {
	action: GqlPolicyAction!
	priority: Int!
	"""
	Action-specific parameter. For LOG: rate-limit interval in milliseconds (0 = no limit).
	"""
	param: Int! = 0
}

"""
Input for adding a rule
"""
input AddRuleInput {
	"""
	Network interface name the rule applies to (e.g., "eth0", "enp1s0").
	Rules are scoped per-interface per-direction.
	"""
	interface: String!
	"""
	Traffic direction: INGRESS or EGRESS
	"""
	direction: GqlDirection!
	"""
	Source IP/CIDR (e.g., "192.168.1.0/24" or "10.0.0.1/32")
	"""
	src: String
	"""
	Destination IP/CIDR
	"""
	dst: String
	"""
	Source port (0 for any)
	"""
	sport: Int! = 0
	"""
	Destination port (0 for any)
	"""
	dport: Int! = 0
	"""
	Protocol: "tcp", "udp", "icmp", "any"
	"""
	protocol: String! = "any"
	"""
	Ordered list of actions to apply. Actions are processed by priority (lowest first).
	DROP immediately stops further action processing.
	"""
	actions: [ActionInput!]!
	"""
	Optional rule ID (auto-generated if not specified)
	Accepts either String or Int via GraphQL `ID` scalar
	"""
	id: ID
	"""
	TLS SNI pattern to match (e.g., "example.com" or "*.example.com")
	"""
	sni: String
	"""
	QUIC version filter: "any", "v1", "v2", or omit for no filter
	"""
	quicVersion: String
	"""
	Source MAC address filter in colon-hex format (e.g., "aa:bb:cc:dd:ee:ff").
	Omit or null for no filtering. All-zeros is rejected — use null instead.
	"""
	srcMac: String
	"""
	Destination MAC address filter in colon-hex format (e.g., "aa:bb:cc:dd:ee:ff").
	Omit or null for no filtering. All-zeros is rejected — use null instead.
	"""
	dstMac: String
	"""
	Auto-remove rule after this many seconds. Mutually exclusive with `schedule`.
	"""
	expiresAfterSecs: Int
	"""
	Weekly recurring windows during which the rule should be active.
	Mutually exclusive with `expiresAfterSecs`.
	"""
	schedule: RuleScheduleInput
}

"""
Attach ingress input
"""
input AttachIngressInput {
	interface: String!
	"""
	Ingress mode: auto (default), offload, native, or generic
	Auto tries offload → native → generic until one succeeds
	"""
	mode: String! = "auto"
}

"""
Attach egress input
"""
input AttachTcInput {
	interface: String!
}

"""
A single audit log entry.
"""
type AuditEntry {
	timestamp: String!
	operation: String!
	"""
	JSON representation of the mutation input (serialised as a scalar).
	"""
	input: JSON!
	"""
	`"ok"` or `"error"`.
	"""
	result: String!
	message: String!
	sourceIp: String!
}

"""
A formatted audit log export, ready for the client to download.
"""
type AuditExport {
	"""
	Suggested download filename, e.g. `audit-export-20260619T120000Z.csv`.
	"""
	filename: String!
	"""
	MIME content type for the payload (e.g. `text/csv`).
	"""
	contentType: String!
	"""
	The formatted audit log as UTF-8 text.
	"""
	data: String!
}

"""
Result for batch add rules mutation
"""
type BatchAddRulesResult {
	"""
	Total number of rules in the request
	"""
	total: Int!
	"""
	Number of rules successfully added
	"""
	succeeded: Int!
	"""
	Number of rules that failed
	"""
	failed: Int!
	"""
	Overall success (all rules added)
	"""
	success: Boolean!
	"""
	Summary message
	"""
	message: String!
	"""
	Individual results for each rule
	"""
	results: [BatchRuleResult!]!
}

"""
Result for batch delete rules mutation
"""
type BatchDeleteRulesResult {
	"""
	Total number of rules in the request
	"""
	total: Int!
	"""
	Number of rules successfully deleted
	"""
	succeeded: Int!
	"""
	Number of deletes that failed
	"""
	failed: Int!
	"""
	Overall success (all deletes succeeded)
	"""
	success: Boolean!
	"""
	Summary message
	"""
	message: String!
	"""
	Individual results for each delete request
	"""
	results: [BatchRuleResult!]!
}

"""
Result for a single rule in a batch operation
"""
type BatchRuleResult {
	"""
	Index of the rule in the input array
	"""
	index: Int!
	"""
	Rule ID (if successfully added)
	"""
	ruleId: ID
	"""
	Whether this rule was added successfully
	"""
	success: Boolean!
	"""
	Error message if failed
	"""
	error: String
}

"""
Input for configuring the stop-behavior setting.
"""
input ConfigureStopBehaviorInput {
	"""
	"clear-state" — detach programs and remove maps on shutdown.
	"preserve-state" — leave programs and maps in the kernel (legacy behaviour).
	"""
	stopBehavior: String!
}

"""
CPU affinity configuration currently in effect.
"""
type CpuAffinityStatus {
	"""
	True when all CPU pinning is disabled (e.g. in a container).
	"""
	disabled: Boolean!
	"""
	CPUs used by Tokio worker threads and actix-web request handlers.
	"""
	controlCpus: [Int!]!
	"""
	CPU used by the BPF ring-buffer polling thread.
	"""
	eventCpus: [Int!]!
	"""
	CPUs that NIC IRQs and RPS are steered to after interface attach.
	"""
	dataplaneCpus: [Int!]!
	"""
	Number of actix-web worker threads.
	"""
	actixWorkers: Int!
}

"""
Config input for default action
"""
input DefaultActionInput {
	"""
	Network interface name to set the default action on.
	"""
	interface: String!
	action: GqlPolicyAction!
	"""
	Traffic direction: INGRESS or EGRESS
	"""
	direction: GqlDirection!
}

"""
Input for deleting a rule
"""
input DeleteRuleInput {
	"""
	Network interface name the rule is scoped to.
	"""
	interface: String!
	"""
	Traffic direction: INGRESS or EGRESS
	"""
	direction: GqlDirection!
	"""
	Rule ID to delete (ID scalar accepts string or int)
	"""
	id: ID!
}

"""
Detach ingress input
"""
input DetachIngressInput {
	interface: String!
}

"""
Detach egress input
"""
input DetachTcInput {
	interface: String!
}

"""
Ethertype statistics output type.
`ethertype` is the numeric value; callers should format it as hex for display.
"""
type EthertypeStatsOutput {
	ethertype: Int!
	name: String!
	packets: Int!
}

"""
FIB forwarding enable state for a single interface.
"""
type FibForwardingEntry {
	interface: String!
	enabled: Boolean!
}

"""
Individual flow verdict entry
"""
type FlowVerdictOutput {
	srcIp: String!
	dstIp: String!
	srcPort: Int!
	dstPort: Int!
	protocol: String!
	action: String!
	"""
	Expiry time as nanoseconds since Unix epoch (as string to avoid i64 precision issues)
	"""
	expiresNs: String!
	"""
	Whether this verdict has already expired
	"""
	expired: Boolean!
	"""
	Total packets matched by this cached verdict
	"""
	packets: Int!
	"""
	Total bytes matched by this cached verdict
	"""
	bytes: Int!
}

"""
Flow verdict statistics
"""
type FlowVerdictStatsOutput {
	activeVerdicts: Int!
}

"""
Global statistics output type
"""
type GlobalStatsOutput {
	rxPackets: Int!
	rxBytes: Int!
	txPackets: Int!
	txBytes: Int!
	policyMatches: Int!
	policyDrops: Int!
	policyPass: Int!
	policyRedirects: Int!
	parseErrors: Int!
	tailCalls: Int!
	bumPackets: Int!
	nonIpUnicast: Int!
	inspectRedirects: Int!
	fragments: Int!
	"""
	Flow verdict cache: packets/bytes that hit a PASS verdict
	"""
	verdictPassPackets: Int!
	verdictPassBytes: Int!
	"""
	Flow verdict cache: packets/bytes that hit a DROP verdict
	"""
	verdictDropPackets: Int!
	verdictDropBytes: Int!
	"""
	XDP FIB forwarding: packets successfully forwarded via bpf_redirect
	"""
	fibForwardedPackets: Int!
	fibForwardedBytes: Int!
	"""
	XDP FIB forwarding: packets where FIB lookup was attempted but fell back to XDP_PASS
	"""
	fibFallbackPackets: Int!
	"""
	uRPF: packets/bytes dropped by the reverse-path check (source spoofing)
	"""
	urpfDropPackets: Int!
	urpfDropBytes: Int!
}

"""
Traffic direction for GraphQL
"""
enum GqlDirection {
	INGRESS
	EGRESS
}

"""
Policy action enum for GraphQL
"""
enum GqlPolicyAction {
	PASS
	DROP
	LOG
	"""
	Internal action: triggers a tail call for further processing
	"""
	TAIL_CALL
}

"""
Protocol type for GraphQL
"""
enum GqlProtocol {
	ANY
	TCP
	UDP
	ICMP
}

"""
Interface attachment info
"""
type InterfaceAttachment {
	interface: String!
	ifindex: Int!
	mode: String!
	direction: String!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

"""
LPM rule output type (for IPv4 and IPv6)
"""
type LpmRuleOutput {
	ruleId: ID!
	"""
	Network interface the rule is scoped to (empty string if unresolved).
	"""
	interface: String!
	srcPrefix: String!
	dstPrefix: String!
	sport: Int!
	dport: Int!
	protocol: GqlProtocol!
	actions: [RuleActionOutput!]!
	"""
	TLS SNI pattern if set
	"""
	sni: String
	"""
	QUIC version filter if set ("any", "v1", "v2")
	"""
	quicVersion: String
	"""
	Source MAC filter if set (colon-hex format, e.g. "aa:bb:cc:dd:ee:ff")
	"""
	srcMac: String
	"""
	Destination MAC filter if set (colon-hex format, e.g. "aa:bb:cc:dd:ee:ff")
	"""
	dstMac: String
}

"""
Output type for a rule that has TTL or schedule metadata.
"""
type ManagedRuleOutput {
	ruleId: ID!
	direction: GqlDirection!
	"""
	Interface name the rule is scoped to (e.g. "eth0"). Empty string when the
	interface can no longer be resolved from its ifindex (e.g. after detach).
	"""
	interface: String!
	srcPrefix: String!
	dstPrefix: String!
	sport: Int!
	dport: Int!
	protocol: GqlProtocol!
	actions: [RuleActionOutput!]!
	sni: String
	quicVersion: String
	"""
	Unix timestamp in milliseconds when the TTL expires. `null` for scheduled/permanent rules.
	"""
	expiresAtMs: String
	"""
	Weekly schedule. `null` for TTL/permanent rules.
	"""
	schedule: RuleScheduleOutput
	"""
	`"active"` or `"inactive"`.
	"""
	ruleState: String!
}

type MutationRoot {
	"""
	Attach ingress program to an interface
	
	Mode can be: "auto" (default), "offload", "native", or "generic"
	Auto mode tries offload → native → generic until one succeeds
	"""
	attachIngress(input: AttachIngressInput!): OperationResult!
	"""
	Detach ingress program from an interface
	"""
	detachIngress(input: DetachIngressInput!): OperationResult!
	"""
	Attach egress program to an interface
	"""
	attachTc(input: AttachTcInput!): OperationResult!
	"""
	Detach egress program from an interface
	"""
	detachTc(input: DetachTcInput!): OperationResult!
	"""
	Detach all programs (both ingress and egress)
	"""
	detachAll: OperationResult!
	"""
	Add a policy rule
	"""
	addRule(input: AddRuleInput!): OperationResult!
	"""
	Add multiple policy rules in a batch (more efficient than individual adds)
	"""
	addRules(rules: [AddRuleInput!]!): BatchAddRulesResult!
	"""
	Delete multiple policy rules in a batch
	"""
	deleteRules(rules: [DeleteRuleInput!]!): BatchDeleteRulesResult!
	"""
	Delete a policy rule by ID.
	"""
	deleteRule(input: DeleteRuleInput!): OperationResult!
	"""
	Flush all rules scoped to a single interface+direction.
	"""
	flushRules(interface: String!, direction: GqlDirection!): OperationResult!
	"""
	Set default action for unmatched packets on a specific interface
	"""
	setDefaultAction(input: DefaultActionInput!): OperationResult!
	"""
	Register a tail call program
	"""
	registerTailCall(input: TailCallInput!): OperationResult!
	"""
	Enable or disable XDP FIB forwarding (line-rate packet forwarding via bpf_fib_lookup)
	"""
	setFibForwarding(input: SetFibForwardingInput!): OperationResult!
	"""
	Set the uRPF (unicast Reverse Path Forwarding) mode on a single ingress
	interface. uRPF is ingress-only (XDP); enabling it on an interface
	without XDP attached (e.g. a TC egress interface) is rejected.
	"""
	setUrpf(input: SetUrpfInput!): OperationResult!
	"""
	Set the stop behavior for the policy engine daemon.
	
	`input.stop_behavior` must be "clear-state" or "preserve-state".
	"clear-state" (default): detach all BPF programs and remove pinned maps on shutdown.
	"preserve-state": leave programs attached and maps in the kernel (traffic
	enforcement continues while the daemon is not running).
	"""
	configureStopBehavior(input: ConfigureStopBehaviorInput!): OperationResult!
	"""
	Clear global statistics for an interface
	"""
	clearGlobalStats(interface: String!, direction: GqlDirection!): OperationResult!
	"""
	Clear statistics for a specific rule
	"""
	clearRuleStats(ruleId: String!, direction: GqlDirection!): OperationResult!
	"""
	Clear statistics for all rules
	"""
	clearAllRuleStats(direction: GqlDirection!): OperationResult!
	"""
	Clear ethertype statistics for an interface
	"""
	clearEthertypeStats(interface: String!, direction: GqlDirection!): OperationResult!
	"""
	Clear all statistics for an interface (global + ethertype)
	"""
	clearInterfaceStats(interface: String!, direction: GqlDirection!): OperationResult!
	"""
	Clear all statistics
	"""
	clearAllStats: OperationResult!
	"""
	Clear flow verdicts for a direction
	"""
	clearFlowVerdicts(direction: GqlDirection!): OperationResult!
}

"""
Non-IP sender statistics output type.
One entry per (source MAC, ethertype) pair observed on ingress.
`ethertype` is the numeric value; callers should format it as hex for display.
"""
type NonIpSenderOutput {
	"""
	Source MAC address in colon-separated hex (e.g. "aa:bb:cc:dd:ee:ff")
	"""
	mac: String!
	"""
	Ethertype numeric value
	"""
	ethertype: Int!
	"""
	Human-readable ethertype name ("ARP", "LLDP", "Unknown", …)
	"""
	name: String!
	"""
	Packet count for this (MAC, ethertype) pair
	"""
	packets: Int!
}

"""
Generic operation result
"""
type OperationResult {
	success: Boolean!
	message: String!
}

"""
Combined performance statistics output
"""
type PerformanceStatsOutput {
	"""
	L4 (IP) protocol breakdown — keyed by IP protocol number
	"""
	protoStats: [ProtoStatsOutput!]!
	"""
	L3 protocol breakdown — keyed by ethertype (0x0800=IPv4, 0x86DD=IPv6, 0x0806=ARP, 0=Other)
	"""
	l3Stats: [ProtoStatsOutput!]!
	rxBytesPerSec: Int!
	txBytesPerSec: Int!
}

"""
Per-protocol traffic statistics
"""
type ProtoStatsOutput {
	protocol: Int!
	name: String!
	packets: Int!
	bytes: Int!
}

type QueryRoot {
	"""
	Get server status
	"""
	status: ServerStatus!
	"""
	Get server compile-time feature flags
	"""
	serverFeatures: ServerFeaturesOutput!
	"""
	List per-interface XDP FIB forwarding state.
	"""
	fibForwarding: [FibForwardingEntry!]!
	"""
	List per-interface uRPF (unicast Reverse Path Forwarding) mode.
	Only interfaces with uRPF enabled are returned.
	"""
	urpf: [UrpfEntry!]!
	"""
	List all attached interfaces
	"""
	interfaces: [InterfaceAttachment!]!
	"""
	List all available network interfaces on the system
	"""
	availableInterfaces: [String!]!
	"""
	Get global statistics for an interface
	"""
	stats(interface: String!, direction: GqlDirection!): GlobalStatsOutput!
	"""
	Get ethertype statistics for an interface (non-IP traffic breakdown)
	"""
	ethertypeStats(interface: String!, direction: GqlDirection!): [EthertypeStatsOutput!]!
	"""
	Get non-IP sender statistics for an interface (ingress only).
	Returns one entry per (source MAC, ethertype) pair, sorted by packet count desc.
	"""
	nonipSenders(interface: String!): [NonIpSenderOutput!]!
	"""
	Get statistics for a specific rule
	"""
	ruleStats(ruleId: String!, direction: GqlDirection!): RuleStatsOutput
	"""
	List all policy rules for a direction
	"""
	rules(direction: GqlDirection!): [LpmRuleOutput!]!
	"""
	Return the current default action for a specific interface+direction ("PASS" or "DROP").
	Returns "PASS" when no default has been explicitly set.
	"""
	defaultAction(interface: String!, direction: GqlDirection!): String!
	"""
	List rules that have a TTL or schedule (managed rules).
	
	Returns all managed rules regardless of their current state (active or
	inactive). Rules without a lifecycle constraint are not included here —
	use the `rules` query for those.
	"""
	managedRules(direction: GqlDirection!): [ManagedRuleOutput!]!
	"""
	Get flow verdict statistics for a direction
	"""
	flowVerdicts(direction: GqlDirection!): FlowVerdictStatsOutput!
	"""
	List individual flow verdict entries for a direction.
	
	Entries are returned soonest-expiring first and capped at `limit`
	(default 1000) to bound the response — the cache can hold tens of
	thousands of entries per direction.
	"""
	flowVerdictList(direction: GqlDirection!, limit: Int): [FlowVerdictOutput!]!
	"""
	Get performance statistics (per-protocol stats, L3 breakdown, bandwidth)
	"""
	performanceStats(interface: String!, direction: GqlDirection!): PerformanceStatsOutput!
	"""
	Query QUIC version stats (ingress only; egress returns empty)
	"""
	quicStats(direction: GqlDirection!): [QuicStatsOutput!]!
	"""
	Query recent audit log entries
	"""
	auditLog(limit: Int): [AuditEntry!]!
	"""
	Export audit log entries within an optional time window.
	
	`format` selects the output (`"csv"` or `"json"`). `from`/`to` are
	optional inclusive RFC 3339 timestamps; either may be omitted to leave
	that side of the window open. Entries are read from the durable on-disk
	log, not just the in-memory ring.
	"""
	exportAuditLog(format: String!, from: String, to: String): AuditExport!
	"""
	Get the current stop behavior setting.
	"""
	stopBehavior: StopBehavior!
}

"""
QUIC version packet/byte statistics
"""
type QuicStatsOutput {
	version: String!
	packets: Int!
	bytes: Int!
}

"""
Rule action output type
"""
type RuleActionOutput {
	action: GqlPolicyAction!
	priority: Int!
	"""
	Action-specific parameter. For LOG: rate-limit interval in milliseconds (0 = no limit).
