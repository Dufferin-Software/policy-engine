}

"""
uRPF (unicast Reverse Path Forwarding) mode for an interface.
uRPF is ingress-only (XDP); it can never be enabled on egress.
"""
enum UrpfMode {
	OFF
	LOOSE
	STRICT
}

"""
A point-in-time within a repeating week.
`dayOfWeek`: 0 = Sunday … 6 = Saturday.
"""
input WeeklyTimePointInput {
	dayOfWeek: Int!
	hour: Int!
	minute: Int!
}

"""
Output type: point-in-time within a week.
"""
type WeeklyTimePointOutput {
	dayOfWeek: Int!
	hour: Int!
	minute: Int!
}

"""
A half-open weekly time window `[start, end)`.
"""
input WeeklyWindowInput {
	start: WeeklyTimePointInput!
	end: WeeklyTimePointInput!
}

"""
Output type: weekly window.
"""
type WeeklyWindowOutput {
	start: WeeklyTimePointOutput!
	end: WeeklyTimePointOutput!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
