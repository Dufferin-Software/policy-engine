[package]
name = "policy-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"
description = "Central controller for managing a fleet of policy-engine nodes"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"
hex = "0.4"
sha2 = "0.10"
subtle = "2.5"
base64 = "0.22"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

# gRPC / protobuf — shared protocol types
policy-controller-proto = { path = "../proto" }
tonic = { version = "0.12", features = ["transport", "tls"] }
tokio-stream = "0.1"

# Cryptography — CA key management and cert issuance
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
x509-parser = "0.16"
async-stream = "0.3"

# State store
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Alert matcher: CIDR membership for src/dst_cidr, glob matching for sni_glob.
ipnetwork = "0.20"
globset = "0.4"

# Alert dispatcher: HTTP client for the webhook + Alertmanager providers.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Alert dispatcher: SMTP for the email provider.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
    "hostname",
] }

# GraphQL operator API
async-graphql = { version = "7", features = ["log", "chrono"] }
async-graphql-actix-web = "7"
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-cors = "0.7"
actix-files = "0.6"
actix-ws = "0.3"
futures-util = "0.3"

# Concurrent map used by the bearer-auth middleware to throttle last_used_at writes.
dashmap = "6"

# Operator password hashing (argon2id). See docs/login-flow.md.
argon2 = { version = "0.5", features = ["std", "password-hash"] }
password-hash = { version = "0.5", features = ["std"] }
# Interactive password prompt for the add-operator bin.
rpassword = "7"

# Unique IDs for rulesets, enrollment requests, etc.
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

policy-controller-dev = { path = "../controller-dev" }

[dev-dependencies]
mockall = "0.12"
tempfile = "3"

[[bin]]
name = "policy-controller"
path = "src/bin/controller.rs"

[[bin]]
name = "policy-controller-client"
path = "src/bin/client.rs"

[[bin]]
name = "policy-controller-print-schema"
path = "src/bin/print_schema.rs"

[[bin]]
name = "policy-controller-mint-token"
path = "src/bin/mint_token.rs"

[[bin]]
name = "policy-controller-add-operator"
path = "src/bin/add_operator.rs"

[[bin]]
name = "policy-controller-bootstrap-tenant"
path = "src/bin/bootstrap_tenant.rs"
