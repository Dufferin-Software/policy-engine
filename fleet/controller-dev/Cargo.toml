description = "GraphQL client library for the policy controller"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
