[package]
name = "policy-node-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"
description = "Fleet management agent for the policy-engine — bridges the controller to the local policy-engine server"

[dependencies]
anyhow = "1.0"
nix = { version = "0.27", features = ["net", "feature"] }
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
clap = { version = "4.4", features = ["derive", "env"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# `time` is a transitive dep via rcgen; the renewal test uses it directly to
# mint test certs with a chosen validity window.
time = "0.3"
futures-util = "0.3"

# Cryptography — ECDSA P-256 identity key + CSR generation
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
sha2 = "0.10"
gethostname = "1.0"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
prometheus = { version = "0.13", default-features = false }
once_cell = "1"
rcgen = "0.13"
x509-parser = "0.16"
base64 = "0.22"

# TLS — for loading CA cert and client cert/key
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
http = "1"

# Local policy-engine GraphQL client library (for ConfigApplier)
policy-engine-dev = { path = "../../engine/client-lib" }

# HTTP client for metrics scraping (localhost, no TLS)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
# WebSocket client for event forwarding
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# gRPC / protobuf
policy-controller-proto = { path = "../proto" }
tonic = { version = "0.12", features = ["transport", "tls"] }
tss-esapi = "7.7"

[dev-dependencies]
mockall = "0.12"
tempfile = "3"

[[bin]]
name = "policy-node-agent"
path = "src/bin/agent.rs"
